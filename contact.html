<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a quote — Falmouth Auto Center</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1a1d24;line-height:1.55;background:#c8e6fa}
  header{background:#10131a;color:#fff;padding:18px 24px}
  header a{color:#cfd6e4;text-decoration:none}
  .wrap{max-width:560px;margin:40px auto;padding:0 24px}
  h1{font-size:26px;margin-bottom:8px}
  p.sub{color:#5b6472;margin-bottom:24px}
  label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
  input,textarea{width:100%;padding:11px 12px;border:1px solid #cfd6e4;border-radius:8px;font-size:15px}
  .consent{display:flex;gap:10px;margin-top:18px;align-items:flex-start;background:#f6f8fb;border:1px solid #e6e8ee;border-radius:10px;padding:14px}
  .consent input{width:auto;margin-top:4px}
  .consent label{font-weight:400;font-size:13px;color:#3a4150;margin:0}
  .btn{margin-top:20px;background:#c9302c;color:#fff;border:none;padding:13px 22px;border-radius:8px;font-weight:600;font-size:15px;cursor:pointer;width:100%}
  .fine{font-size:12px;color:#8a93a3;margin-top:14px;line-height:1.5}
  a{color:#c9302c}
</style>
</head>
<body>
  <header><a href="/">&larr; Falmouth Auto Center</a></header>
  <div class="wrap">
    <h1>Get a free quote</h1>
    <p class="sub">Tell us what your vehicle needs. We will get back to you fast.</p>
    <!-- Formspree: leads vao pro email falmouthautocenter@yahoo.com. Trocar FORMSPREE_ID pelo id real do form. -->
    <form method="POST" action="https://formspree.io/f/FORMSPREE_ID">
      <input type="hidden" name="_subject" value="New quote request — Falmouth Auto Center">
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" required>

      <label for="phone">Mobile phone</label>
      <input id="phone" name="phone" type="tel" placeholder="(555) 555-5555" required>

      <label for="email">Email (optional)</label>
      <input id="email" name="email" type="email">

      <label for="vehicle">Vehicle (year, make, model)</label>
      <input id="vehicle" name="vehicle" type="text">

      <label for="message">What does it need?</label>
      <textarea id="message" name="message" rows="3"></textarea>

      <div class="consent">
        <!-- SEM `required`: o TCR reprova campanha A2P quando o consentimento de SMS e
     condicao pra enviar o formulario. Consentimento tem que ser OPCIONAL. -->
        <input id="sms_consent" name="sms_consent" type="checkbox">
        <label for="sms_consent">
          <b>Optional.</b> By checking this box, I agree to receive text messages from Falmouth Auto Center about appointments, service reminders, and offers at the phone number provided. Consent is not a condition of purchase. Message and data rates may apply. Message frequency varies. Reply STOP to opt out, HELP for help. See our <a href="/privacy">Privacy Policy</a> and <a href="/terms">Terms</a>.
        </label>
      </div>

      <button class="btn" type="submit">Send</button>
      <p class="fine">Falmouth Auto Center will never sell or share your phone number with third parties for marketing. Your consent and contact info are stored securely.</p>
    </form>
  </div>
</body>
</html>
